# Free Hugging Face Spaces sleep after 48 hours with no visitors, and waking resets the app's state.
# Opening the app's health check every 6 hours keeps the hosted demo awake for judges.
name: keep Space awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open the app's health check
        run: |
          # A sleeping Space takes about a minute to wake, so retry for up to 5 minutes.
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://wicky2002-atlas.hf.space/health || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "The Space did not answer with 200 after 10 attempts" >&2
          exit 1
