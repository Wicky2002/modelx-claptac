label_meaning: The file has no landslide labels. Any target must be a sensor measurement.
missingness: No blank cells. Units are not stated in the file.
permitted_use: Research and derivative work with attribution, under CC BY 4.0. Must not be presented as landslide warning, because it contains no landslide events.
limits:
  - Rain in only 13 hours, peaking at 1.5, and soil sensors barely move.
  - One month from one site.
